version: '3.8'

services:
  # Infrastructure Services
  postgres:
    image: postgres:15
    container_name: datn_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: datn_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: datn_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  minio:
    image: minio/minio
    container_name: datn_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  redis:
    image: redis:alpine
    container_name: datn_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  createbuckets:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc config host add myminio http://minio:9000 minioadmin minioadmin) do echo '...waiting...' && sleep 1; done;
      /usr/bin/mc mb --ignore-existing myminio/video;
      /usr/bin/mc mb --ignore-existing myminio/tempvideo;
      /usr/bin/mc mb --ignore-existing myminio/background;
      /usr/bin/mc mb --ignore-existing myminio/backups;
      /usr/bin/mc anonymous set public myminio/background;
      exit 0;
      "

  # Backend Services
  users-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: users
    container_name: datn_users
    depends_on:
      - postgres
      - rabbitmq
      - redis
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/datn_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=3000
    ports:
      - "3001:3000"

  course-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: course
    container_name: datn_course
    depends_on:
      - rabbitmq
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - PORT=3000
    ports:
      - "3002:3000"

  enrollment-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: enrollment
    container_name: datn_enrollment
    depends_on:
      - rabbitmq
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - PORT=3000
    ports:
      - "3003:3000"

  order-payment-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: order_payment
    container_name: datn_order_payment
    depends_on:
      - rabbitmq
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - PORT=3000
    ports:
      - "3004:3000"

  recommend-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: recommend
    container_name: datn_recommend
    depends_on:
      - postgres
      - rabbitmq
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/datn_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - PORT=3000
    ports:
      - "3005:3000"

  storage-video-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: storage_video
    container_name: datn_storage_video
    depends_on:
      - minio
      - rabbitmq
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_REGION=us-east-1
      - AWS_BUCKET_NAME=videos
      - AWS_ENDPOINT=http://minio:9000
      - PORT=3000
    ports:
      - "3006:3000"

  rag-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: RAG
    container_name: datn_rag
    depends_on:
      - rabbitmq
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - PORT=3000
    ports:
      - "3007:3000"

  backup-service:
    build:
      context: ./backend
      dockerfile: app/backup/Dockerfile
    container_name: datn_backup
    depends_on:
      - postgres
      - minio
    environment:
      - DB_HOST=postgres
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=datn_db
      - MINIO_ENDPOINT_HOST=minio
      - MINIO_PORT=9000
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin

  # Frontend
  frontend:
    build:
      context: ./fontend/fontend
      dockerfile: Dockerfile
    container_name: datn_frontend
    depends_on:
      - users-service
      - course-service
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001 # Pointing to users service for auth, adjust as needed

volumes:
  postgres_data:
  minio_data:
  redis_data:
